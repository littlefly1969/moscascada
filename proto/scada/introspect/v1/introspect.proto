// Read-only test/diagnostic introspection of a running kernel. Disabled unless the
// kernel is started with --introspection-socket. Same framing as scada.driver.v1.
// Not a public API: it exists so multi-process tests and benchmarks can observe the
// logical state, the digest and the runtime counters.
syntax = "proto3";

package scada.introspect.v1;

message IntrospectRequest {
  bool include_tags = 1;
  // Must be 1. Also guarantees a non-empty encoding (zero-length frames are invalid).
  uint32 introspect_version = 2;
  // VS-002: zero the diagnostic histograms after answering (benchmark warm-up).
  bool reset_diagnostics = 3;
}

enum Quality {
  QUALITY_UNSPECIFIED = 0;
  QUALITY_UNKNOWN = 1;
  QUALITY_GOOD = 2;
  QUALITY_UNCERTAIN_SOURCE_UNAVAILABLE = 3;
  // VS-004 (liveness supervision): the link stayed open but the source was silent.
  QUALITY_UNCERTAIN_SOURCE_SILENT = 4;
  // VS-004 (freshness supervision): no new observation within the freshness timeout.
  QUALITY_UNCERTAIN_STALE_DATA = 5;
}

message TagState {
  uint32 tag_id = 1;
  oneof value {
    bool bool_value = 2;
    sint64 i64_value = 3;
  }
  Quality quality = 4;
  uint64 revision = 5;
  // VS-004: operation sequence of the last applied observation (0 = never, or source
  // without freshness supervision). Logical state (part of digest v2).
  uint64 last_observed_operation = 6;
}

// VS-004: liveness of the active link, logical state (part of digest v2).
enum Liveness {
  LIVENESS_UNSPECIFIED = 0;
  // The source has no liveness supervision.
  LIVENESS_NOT_SUPERVISED = 1;
  // Supervised and no link is active (never connected or disconnected).
  LIVENESS_NO_LINK = 2;
  LIVENESS_ALIVE = 3;
  // The link is still Connected but no liveness evidence arrived in time.
  LIVENESS_SILENT = 4;
}

enum LinkState {
  LINK_STATE_UNSPECIFIED = 0;
  LINK_STATE_NEVER_CONNECTED = 1;
  LINK_STATE_CONNECTED = 2;
  LINK_STATE_DISCONNECTED = 3;
}

message SourceState {
  uint32 source_id = 1;
  LinkState link_state = 2;
  uint64 link_generation = 3;
  optional fixed64 source_epoch = 4;
  optional uint64 last_accepted_source_sequence = 5;
  // VS-004.
  Liveness liveness = 6;
  // VS-004: operation sequence of the last applied batch (0 = none or unsupervised).
  uint64 last_batch_operation = 7;
  bool freshness_supervised = 8;
}

message RuntimeCounters {
  uint64 connections_accepted = 1;
  uint64 connections_refused_limit = 2;
  uint64 handshakes_rejected = 3;
  uint64 protocol_errors = 4;
  uint64 batches_applied = 5;
  uint64 batches_duplicate = 6;
  uint64 batches_rejected = 7;
  // Times a producer had to wait because the sequencer input queue was full.
  uint64 input_queue_full_waits = 8;
  uint32 input_queue_capacity = 9;
  uint32 active_connections = 10;
  // VS-002: connections closed because the peer did not read its ACKs in time.
  uint64 ack_write_timeouts = 11;
  // VS-002: connections closed because a newer link took over their source.
  uint64 links_superseded = 12;
  // VS-004 (operational metrics, NOT part of the digest). Fixed cardinality.
  uint64 heartbeats_valid = 13;
  // Heartbeats that closed the link (sequence not increasing, or minor not negotiated).
  uint64 heartbeats_invalid = 14;
  // Valid heartbeats beyond the first one between two watchdog ticks of the same link
  // (they carry no extra evidence; the coalescing is the rate limit).
  uint64 heartbeats_coalesced = 15;
  uint64 liveness_expiries = 16;
  // Silent -> Alive transitions of the same link, whatever caused them: a heartbeat
  // (SourceLivenessRestored) or an applied batch (which clears Silent inside its own
  // apply; counted by the next watchdog tick that sees it). A disconnection or takeover
  // is not a recovery.
  uint64 liveness_recoveries = 17;
  // FreshnessExpired operations applied, and tags they moved to StaleData.
  uint64 freshness_expiries = 18;
  uint64 freshness_tags_expired = 19;
  uint64 watchdog_ticks = 20;
  // Ticks raised while the previous one was not yet served by the sequencer.
  uint64 watchdog_ticks_coalesced = 21;
  // Ticks served more than one poll interval after they were raised.
  uint64 watchdog_ticks_late = 22;
  // Largest tick lateness observed, nanoseconds.
  uint64 watchdog_max_late_ns = 23;
  // The part of liveness_recoveries caused by an applied batch (the rest: heartbeats).
  uint64 liveness_recoveries_by_batch = 24;
}

message IntrospectResponse {
  bytes kernel_instance_id = 1;
  bytes state_digest = 2;
  uint64 last_operation_sequence = 3;
  bytes config_fingerprint = 4;
  repeated TagState tags = 5;
  repeated SourceState sources = 6;
  RuntimeCounters counters = 7;
  // VS-002: stage timings, present only when the kernel runs with --diag.
  repeated StageStats stages = 8;
  // VS-002: scheduler of the I/O edge, e.g. "current_thread" or "multi_thread(2)".
  string scheduler = 9;
  // VS-004: encoding version of state_digest (1 unsupervised, 2 supervised).
  uint32 state_digest_version = 10;
}

// VS-002: summary of one diagnostic histogram. Values are nanoseconds,
// wall clock, bucket resolution about 3 %.
message StageStats {
  string name = 1;
  uint64 count = 2;
  uint64 sum_ns = 3;
  uint64 p50_ns = 4;
  uint64 p99_ns = 5;
  uint64 p999_ns = 6;
  uint64 max_ns = 7;
}
