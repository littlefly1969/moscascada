// SCADA kernel <-> driver protocol, major version 1.
//
// Transport: Unix domain stream socket. Every message is one frame:
//   u32 big-endian payload length (1..=max_frame_bytes) followed by the payload.
// The driver sends DriverMessage frames, the kernel sends KernelMessage frames.
//
// Identity: driver_id names the software component that opened the connection;
// source_id names the configured, stable data source. One connection carries
// exactly one logical session for one source_id. A driver serving several sources
// opens one connection per source; the kernel does not change.
//
// Durability: the kernel keeps state only in RAM. ACK_STATUS_APPLIED_VOLATILE
// promises nothing about surviving a crash, shutdown or restart of the kernel.
// A different kernel_instance_id means previously acknowledged state is lost.
//
// Evolution rules: never reuse or renumber a field or enum value; reserve removed
// numbers; no protobuf map for order-sensitive data.
//
// Minor versions (feature negotiation inside major 1, VS-004 / ADR 0011):
//   1.0  VS-001..VS-003.
//   1.1  Heartbeat (DriverMessage.heartbeat). A driver announces the highest minor it
//        implements in Hello.protocol_minor; the kernel answers
//        Welcome.negotiated_protocol_minor = min(kernel minor, Hello.protocol_minor).
//        A driver MUST NOT send a message of minor N unless the negotiated minor is >= N.
//        A 1.0 kernel ignores the unknown Hello field and answers minor 0, so an updated
//        driver falls back to 1.0 without any other change; a 1.0 driver never sets the
//        field and keeps working unchanged with a 1.1 kernel.
//   1.2  VS-006 (ADR 0013 D11, ADR 0014 §6), all optional and additive:
//        * durable receipts: Hello.request_durable_receipts; Welcome.durable_receipts is
//          true only when the kernel journals with power-loss durability. Then every
//          applied batch gets ONE final InputAck, sent only after the journal transaction
//          that contains it committed: ACK_STATUS_APPLIED_DURABLE (or
//          ACK_STATUS_APPLIED_NOT_DURABLE if that commit failed). Without the request (or
//          with a 1.0/1.1 driver) the ACK stays ACK_STATUS_APPLIED_VOLATILE, which keeps
//          meaning "RAM only" even when the kernel journals.
//        * source timestamps: ObservationBatch.source_timestamps_utc_ns (aligned),
//          ObservationBatch.acquired_at_utc_ns / source_clock_quality / source_clock_id.
//          Sidecar data: never part of the value, of the deduplication or of the digest;
//          preserved unchanged in the journal. Absent = not available (never "now").
//        A driver MUST NOT rely on 1.2 features unless the negotiated minor is >= 2.
syntax = "proto3";

package scada.driver.v1;

// First frame on every connection.
message Hello {
  // Free-form identifier of the driver software (diagnostic, max 64 bytes UTF-8).
  string driver_id = 1;
  // Configured source this session will feed. Authorised against kernel config and
  // the peer's Unix credentials; it is a request, not an authentication.
  uint32 source_id = 2;
  // Opaque identity of the producer's data session; MUST be non-zero and MUST change
  // when the producer restarts. May stay equal across reconnects without restart.
  fixed64 source_epoch = 3;
  // Protocol major versions the driver can speak.
  repeated uint32 supported_protocol_majors = 4;
  // VS-004: highest minor version of major 1 the driver implements (absent = 0, i.e. 1.0).
  uint32 protocol_minor = 5;
  // VS-006, minor 1.2: ask for durable receipts (see the header). Ignored unless the
  // negotiated minor is >= 2 and the kernel journals durably (Welcome.durable_receipts).
  bool request_durable_receipts = 6;
}

// Limits the kernel enforces on this connection.
message SessionLimits {
  uint32 max_frame_bytes = 1;
  uint32 max_observations_per_batch = 2;
  uint32 max_inflight_batches = 3;
}

// Positive handshake answer.
message Welcome {
  // 16 random bytes generated at kernel start; changes on every kernel restart.
  bytes kernel_instance_id = 1;
  uint32 negotiated_protocol_major = 2;
  uint32 negotiated_protocol_minor = 3;
  // Assigned by the kernel sequencer; identifies this link of the source.
  uint64 link_generation = 4;
  SessionLimits limits = 5;
  // True when the kernel has no baseline for (source_id, source_epoch): the next batch
  // must be a FULL_STATE.
  bool full_state_required = 6;
  // Last accepted source_sequence of the same epoch, when a baseline exists. A driver
  // that reconnects without restarting resends batches after this sequence.
  optional uint64 last_accepted_source_sequence = 7;
  // VS-006, minor 1.2: durable receipts are active on this link.
  bool durable_receipts = 8;
  // VS-006: identity of the durable timeline (16 bytes) when the kernel journals; empty
  // otherwise. operation_sequence values are durable identities only together with it
  // and only once acknowledged ACK_STATUS_APPLIED_DURABLE.
  bytes timeline_id = 9;
}

// Negative handshake answer; the kernel closes the connection after sending it.
message HandshakeRejected {
  ErrorCode error_code = 1;
  bytes kernel_instance_id = 2;
  // Diagnostic text, not for programmatic use.
  string detail = 3;
}

enum BatchMode {
  BATCH_MODE_UNSPECIFIED = 0;
  // Complete picture: every configured channel of the source exactly once.
  BATCH_MODE_FULL_STATE = 1;
  // Changes only; requires an established baseline and source_sequence = last + 1.
  BATCH_MODE_DELTA = 2;
}

message Observation {
  uint32 channel_id = 1;
  oneof value {
    bool bool_value = 2;
    sint64 i64_value = 3;
  }
}

// VS-006, minor 1.2: quality of the clock that produced the source timestamps.
enum ClockQuality {
  CLOCK_QUALITY_UNSPECIFIED = 0;
  CLOCK_QUALITY_UNKNOWN = 1;
  CLOCK_QUALITY_SYNCHRONIZED = 2;
  CLOCK_QUALITY_HOLDOVER = 3;
  CLOCK_QUALITY_FAULT = 4;
}

message ObservationBatch {
  BatchMode mode = 1;
  // Per-source, per-epoch batch counter, starting at any value >= 1 for the baseline.
  uint64 source_sequence = 2;
  // Each channel_id at most once; one invalid observation rejects the whole batch.
  repeated Observation observations = 3;
  // VS-006, minor 1.2: when the driver acquired (or recovered) this batch, UTC ns.
  optional sfixed64 acquired_at_utc_ns = 4;
  ClockQuality source_clock_quality = 5;
  // Identity of the clock of the source timestamps (diagnostic, max 64 bytes UTF-8).
  string source_clock_id = 6;
  // VS-006, minor 1.2: per-observation source timestamps, ALIGNED with `observations`:
  // either empty (no source timestamp in this batch) or exactly one entry per
  // observation, in the same order. Entry = time at which the ORIGINATING device declares
  // the observed value occurred, UTC nanoseconds since the Unix epoch, 0 <= t < 2^63;
  // INT64_MIN = not available for that observation. Reported, not authenticated;
  // forwarded unchanged (OPC UA SourceTimestamp principle). Any other negative value or a
  // length mismatch rejects the batch (ERROR_CODE_INVALID_TIMESTAMP).
  // A parallel packed field (not a field of Observation) keeps the decoded Observation of
  // 1.0/1.1 drivers at its VS-005 size, so the configured memory bound of a kernel
  // without [persistence] does not change (J10).
  repeated sfixed64 source_timestamps_utc_ns = 7;
}

// VS-004, minor 1.1: liveness evidence of the driver on this link. Not a measurement:
// it never refreshes a tag and never changes a quality; it can only show that the
// driver process and the link are alive (and end a SourceSilent state of the source).
// The source is the one of the connection's Hello; a heartbeat carries no identity, no
// timestamp and no proof of acquisition. The kernel sends no InputAck for it.
// `sequence` MUST be >= 1 and strictly increasing on the link; otherwise the kernel
// answers ProtocolError{ERROR_CODE_INVALID_HEARTBEAT} and closes the connection.
// Sending heartbeats faster than the kernel needs them is harmless (they are coalesced)
// but useless; a period of about a third of the configured liveness timeout is enough.
message Heartbeat {
  uint64 sequence = 1;
}

message DriverMessage {
  oneof body {
    Hello hello = 1;
    ObservationBatch batch = 2;
    // VS-004: only after a Welcome with negotiated_protocol_minor >= 1; otherwise it is
    // an unexpected message (ProtocolError, connection closed), as for a 1.0 kernel.
    Heartbeat heartbeat = 3;
  }
}

enum AckStatus {
  ACK_STATUS_UNSPECIFIED = 0;
  // Validated and applied entirely in volatile memory. NOT durable.
  ACK_STATUS_APPLIED_VOLATILE = 1;
  // Identical to the last accepted batch; nothing applied again.
  ACK_STATUS_DUPLICATE = 2;
  // No effect on kernel state; see error_code.
  ACK_STATUS_REJECTED = 3;
  // VS-006, minor 1.2 with durable receipts only: applied AND the journal transaction
  // containing it committed with power-loss durability (synchronous=FULL). Final.
  ACK_STATUS_APPLIED_DURABLE = 4;
  // VS-006, durable receipts only: applied in RAM but the journal commit failed
  // (error_code JOURNAL_FAULT / DISK_FULL). NOT durable: after a kernel restart, resend
  // from Welcome.last_accepted_source_sequence.
  ACK_STATUS_APPLIED_NOT_DURABLE = 5;
}

enum Continuity {
  CONTINUITY_UNSPECIFIED = 0;
  // source_sequence == last accepted + 1 in the same epoch.
  CONTINUITY_CONTINUOUS = 1;
  // First FULL_STATE of the epoch: history before it is NOT proven continuous.
  CONTINUITY_BASELINE_ESTABLISHED = 2;
  // FULL_STATE after a gap: state replaced, intermediate events NOT recovered.
  CONTINUITY_RESYNCHRONIZED = 3;
}

// One InputAck per ObservationBatch, in the same order as the batches were sent.
message InputAck {
  uint64 source_sequence = 1;
  AckStatus status = 2;
  // Global applied-transition number; present only for ACK_STATUS_APPLIED_VOLATILE.
  optional uint64 operation_sequence = 3;
  ErrorCode error_code = 4;
  bytes kernel_instance_id = 5;
  Continuity continuity = 6;
  // Kernel's last accepted source_sequence for this source/epoch, if any (resync hint).
  optional uint64 last_accepted_source_sequence = 7;
}

// Fatal protocol error; the kernel closes the connection after sending it.
message ProtocolError {
  ErrorCode error_code = 1;
  string detail = 2;
}

message KernelMessage {
  oneof body {
    Welcome welcome = 1;
    HandshakeRejected handshake_rejected = 2;
    InputAck ack = 3;
    ProtocolError protocol_error = 4;
  }
}

enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  // Handshake
  ERROR_CODE_UNSUPPORTED_VERSION = 1;
  ERROR_CODE_UNKNOWN_SOURCE = 2;
  ERROR_CODE_UNAUTHORIZED = 3;
  ERROR_CODE_TOO_MANY_CONNECTIONS = 4;
  ERROR_CODE_HANDSHAKE_TIMEOUT = 5;
  ERROR_CODE_INVALID_HELLO = 6;
  // Framing / protocol
  ERROR_CODE_FRAME_TOO_LARGE = 10;
  ERROR_CODE_INVALID_FRAME_LENGTH = 11;
  ERROR_CODE_MALFORMED_MESSAGE = 12;
  ERROR_CODE_UNEXPECTED_MESSAGE = 13;
  ERROR_CODE_FRAME_TIMEOUT = 14;
  // VS-004: heartbeat with sequence 0 or not greater than the previous one on the link.
  ERROR_CODE_INVALID_HEARTBEAT = 15;
  // Batch validation (no state change)
  ERROR_CODE_INVALID_MODE = 20;
  ERROR_CODE_EMPTY_BATCH = 21;
  ERROR_CODE_BATCH_TOO_LARGE = 22;
  ERROR_CODE_UNKNOWN_CHANNEL = 23;
  ERROR_CODE_DUPLICATE_CHANNEL = 24;
  ERROR_CODE_MISSING_VALUE = 25;
  ERROR_CODE_TYPE_MISMATCH = 26;
  ERROR_CODE_INCOMPLETE_FULL_STATE = 27;
  // Sequencing (no state change)
  ERROR_CODE_INVALID_SEQUENCE = 30;
  ERROR_CODE_SEQUENCE_GAP = 31;
  ERROR_CODE_STALE_SEQUENCE = 32;
  ERROR_CODE_SEQUENCE_CONFLICT = 33;
  ERROR_CODE_SEQUENCE_OVERFLOW = 34;
  ERROR_CODE_RESYNC_REQUIRED = 35;
  ERROR_CODE_LINK_SUPERSEDED = 36;
  // Kernel capacity / lifecycle
  ERROR_CODE_REVISION_OVERFLOW = 40;
  ERROR_CODE_OPERATION_SEQUENCE_EXHAUSTED = 41;
  ERROR_CODE_KERNEL_SHUTTING_DOWN = 42;
  ERROR_CODE_INTERNAL = 43;
  // VS-005 (ADR 0012): the batch would produce more alarm events than the kernel's outbox
  // has free slots. The batch had NO effect (status REJECTED, source_sequence not
  // consumed, no operation_sequence): resend the same batch later (after
  // last_accepted_source_sequence). Kernels without [alarms] never send it; a legacy
  // driver treats it as any other unknown rejection code.
  ERROR_CODE_OUTBOX_CAPACITY_EXCEEDED = 44;
  // VS-006 (ADR 0013 D4), only from a kernel with [persistence]: refused BEFORE any state
  // change (status REJECTED, source_sequence not consumed); resend the same batch later.
  // The journal queue (operations or bytes) is full.
  ERROR_CODE_JOURNAL_QUEUE_FULL = 45;
  // Free disk space under the configured minimum, database at its cap, or the journal
  // could not commit for lack of space.
  ERROR_CODE_DISK_FULL = 46;
  // The journal failed (I/O error): admission is stopped until the kernel restarts.
  ERROR_CODE_JOURNAL_FAULT = 47;
  // VS-006, minor 1.2: a timestamp outside 0 <= t < 2^63 ns. Nothing applied.
  ERROR_CODE_INVALID_TIMESTAMP = 48;
}
