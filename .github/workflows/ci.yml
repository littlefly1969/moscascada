name: ci
on:
  push:
  pull_request:

jobs:
  stable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain (pinned by rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - name: Install buf
        run: npm install --global @bufbuild/buf@1.75.0
      - name: Install cargo-deny
        run: cargo install cargo-deny --version 0.20.2 --locked
      - name: Checks (includes runtime tests in release under multi_thread(2))
        run: ./scripts/check.sh
      - name: Runtime tests in release, current_thread
        run: cargo build --release -p scada-sim-driver && cargo test --release -p scada-runtime

  fuzz-smoke:
    # Separate from the stable gate: cargo-fuzz needs nightly (libFuzzer + sanitizers).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install nightly --profile minimal
      - run: cargo install cargo-fuzz --version 0.13.2 --locked
      - name: Seed corpus
        run: mkdir -p fuzz/corpus && cp -r fuzz/seeds/* fuzz/corpus/
      - name: frame_decode (60 s)
        run: cd fuzz && cargo +nightly fuzz run -O frame_decode corpus/frame_decode -- -max_total_time=60
      - name: batch_validation (60 s)
        run: cd fuzz && cargo +nightly fuzz run -O batch_validation corpus/batch_validation -- -max_total_time=60
      - name: decode_equivalence (60 s)
        run: mkdir -p fuzz/corpus/decode_equivalence && cd fuzz && cargo +nightly fuzz run -O decode_equivalence corpus/decode_equivalence -- -max_total_time=60
      - name: supervision_transitions (60 s, VS-004)
        run: mkdir -p fuzz/corpus/supervision_transitions && cd fuzz && cargo +nightly fuzz run -O supervision_transitions corpus/supervision_transitions -- -max_total_time=60
      - name: alarm_transitions (60 s, VS-005)
        run: mkdir -p fuzz/corpus/alarm_transitions && cd fuzz && cargo +nightly fuzz run -O alarm_transitions corpus/alarm_transitions -- -max_total_time=60
