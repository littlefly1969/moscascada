# Separate workspace: cargo-fuzz (libFuzzer + sanitizers) needs a nightly toolchain.
# The ordinary build and test suite stays on stable. Run with:
#   cargo +nightly fuzz run frame_decode
#   cargo +nightly fuzz run batch_validation
#   cargo +nightly fuzz run supervision_transitions   (VS-004)
#   cargo +nightly fuzz run journal_decode            (VS-006)
#   cargo +nightly fuzz run --features exp001 owal_envelope_decode   (EXP-001, open-wal spike)
[package]
name = "scada-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4.13"
scada-core = { path = "../crates/scada-core" }
scada-protocol = { path = "../crates/scada-protocol" }
scada-runtime = { path = "../crates/scada-runtime" }
scada-journal = { path = "../crates/scada-journal" }

[features]
# EXP-001: the experimental open-wal journal backend (off by default).
exp001 = ["scada-journal/experimental-open-wal"]

[workspace]
members = ["."]

[[bin]]
name = "frame_decode"
path = "fuzz_targets/frame_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "batch_validation"
path = "fuzz_targets/batch_validation.rs"
test = false
doc = false
bench = false

[[bin]]
name = "gen_corpus"
path = "src/bin/gen_corpus.rs"
test = false
doc = false
bench = false

[[bin]]
name = "decode_equivalence"
path = "fuzz_targets/decode_equivalence.rs"
test = false
doc = false
bench = false

[[bin]]
name = "supervision_transitions"
path = "fuzz_targets/supervision_transitions.rs"
test = false
doc = false
bench = false

[[bin]]
name = "alarm_transitions"
path = "fuzz_targets/alarm_transitions.rs"
test = false
doc = false
bench = false

[[bin]]
name = "journal_decode"
path = "fuzz_targets/journal_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "owal_envelope_decode"
path = "fuzz_targets/owal_envelope_decode.rs"
test = false
doc = false
bench = false
required-features = ["exp001"]
